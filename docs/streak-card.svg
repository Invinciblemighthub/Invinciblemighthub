<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160">

  <defs>
    <linearGradient id="gradBP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7AA2F7"/>
      <stop offset="55%" stop-color="#BB9AF7"/>
      <stop offset="100%" stop-color="#F7768E"/>
    </linearGradient>
    <linearGradient id="gradBC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7AA2F7"/>
      <stop offset="100%" stop-color="#7DCFFF"/>
    </linearGradient>
    <linearGradient id="gradGB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9ECE6A"/>
      <stop offset="55%" stop-color="#7DCFFF"/>
      <stop offset="100%" stop-color="#7AA2F7"/>
    </linearGradient>
    <linearGradient id="gradPO" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BB9AF7"/>
      <stop offset="100%" stop-color="#E0AF68"/>
    </linearGradient>
    <linearGradient id="gradBPP" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7AA2F7"/>
      <stop offset="50%" stop-color="#BB9AF7"/>
      <stop offset="100%" stop-color="#F7768E"/>
    </linearGradient>
    <filter id="glowBP" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

<rect width="480" height="160" rx="16" fill="#1A1B26" filter="url(#softShadow)"/>
<rect x="0" y="0" width="480" height="4" fill="url(#gradPO)"/>

<text x="28" y="36" font-family="Fira Code,monospace" font-size="17" font-weight="800" fill="#E0AF68">🔥 GitHub Contribution Streak</text>
<text x="28" y="54" font-family="Fira Code,monospace" font-size="11" fill="#A9B1D6">Never Stop Building — 1 commit a day keeps bugs away</text>

<g font-family="Orbitron,monospace" text-anchor="middle">
  <!-- 当前 streak -->
  <rect x="26" y="72" width="140" height="68" rx="12" fill="#16161E" stroke="#E0AF68" stroke-opacity="0.4"/>
  <text x="96" y="96" font-size="11" fill="#A9B1D6">Current Streak</text>
  <text x="96" y="128" font-size="30" font-weight="900" fill="#E0AF68">
    001+
    <animate attributeName="fill" values="#E0AF68;#F7768E;#E0AF68" dur="1.6s" repeatCount="indefinite"/>
  </text>
  <!-- 最长 -->
  <rect x="180" y="72" width="140" height="68" rx="12" fill="#16161E" stroke="#7AA2F7" stroke-opacity="0.4"/>
  <text x="250" y="96" font-size="11" fill="#A9B1D6">Longest Streak</text>
  <text x="250" y="128" font-size="30" font-weight="900" fill="#7AA2F7">∞ 🚀</text>
  <!-- 总贡献 -->
  <rect x="334" y="72" width="120" height="68" rx="12" fill="#16161E" stroke="#9ECE6A" stroke-opacity="0.4"/>
  <text x="394" y="96" font-size="11" fill="#A9B1D6">Active Days</text>
  <text x="394" y="128" font-size="30" font-weight="900" fill="#9ECE6A">Every ☀️🌙</text>
</g>
<rect x="0" y="156" width="480" height="4" fill="url(#gradPO)"/>
</svg>