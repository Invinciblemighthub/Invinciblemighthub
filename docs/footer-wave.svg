<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 150" width="980" height="150" preserveAspectRatio="none">

  <defs>
    <linearGradient id="gradBP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7AA2F7"/>
      <stop offset="55%" stop-color="#BB9AF7"/>
      <stop offset="100%" stop-color="#F7768E"/>
    </linearGradient>
    <linearGradient id="gradBC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7AA2F7"/>
      <stop offset="100%" stop-color="#7DCFFF"/>
    </linearGradient>
    <linearGradient id="gradGB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9ECE6A"/>
      <stop offset="55%" stop-color="#7DCFFF"/>
      <stop offset="100%" stop-color="#7AA2F7"/>
    </linearGradient>
    <linearGradient id="gradPO" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BB9AF7"/>
      <stop offset="100%" stop-color="#E0AF68"/>
    </linearGradient>
    <linearGradient id="gradBPP" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7AA2F7"/>
      <stop offset="50%" stop-color="#BB9AF7"/>
      <stop offset="100%" stop-color="#F7768E"/>
    </linearGradient>
    <filter id="glowBP" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

<rect width="980" height="150" fill="#1A1B26"/>
<path d="M0 150 L980 150 L980 70 C 780 30 680 110 490 70 C 280 32 180 110 0 75 Z" fill="url(#gradBP)" opacity="0.9">
  <animate attributeName="d" values="M0 150 L980 150 L980 70 C 780 30 680 110 490 70 C 280 32 180 110 0 75 Z;M0 150 L980 150 L980 55 C 780 110 680 20 490 55 C 280 110 180 20 0 60 Z;M0 150 L980 150 L980 70 C 780 30 680 110 490 70 C 280 32 180 110 0 75 Z" dur="14s" repeatCount="indefinite"/>
</path>
<path d="M0 0 L980 0 L980 40 C 780 85 680 10 490 45 C 280 85 180 10 0 50 Z" fill="url(#gradBC)" opacity="0.55">
  <animate attributeName="opacity" values="0.35;0.8;0.35" dur="7s" repeatCount="indefinite"/>
</path>

