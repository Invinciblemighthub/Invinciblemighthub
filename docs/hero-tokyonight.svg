<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340">

  <defs>
    <linearGradient id="gradBP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7AA2F7"/>
      <stop offset="55%" stop-color="#BB9AF7"/>
      <stop offset="100%" stop-color="#F7768E"/>
    </linearGradient>
    <linearGradient id="gradBC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7AA2F7"/>
      <stop offset="100%" stop-color="#7DCFFF"/>
    </linearGradient>
    <linearGradient id="gradGB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9ECE6A"/>
      <stop offset="55%" stop-color="#7DCFFF"/>
      <stop offset="100%" stop-color="#7AA2F7"/>
    </linearGradient>
    <linearGradient id="gradPO" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BB9AF7"/>
      <stop offset="100%" stop-color="#E0AF68"/>
    </linearGradient>
    <linearGradient id="gradBPP" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7AA2F7"/>
      <stop offset="50%" stop-color="#BB9AF7"/>
      <stop offset="100%" stop-color="#F7768E"/>
    </linearGradient>
    <filter id="glowBP" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

<rect width="900" height="340" rx="26" fill="#1A1B26" filter="url(#softShadow)"/>

<!-- 极光流动背景渐变圆 -->
<circle cx="140" cy="95" r="170" fill="#7AA2F7" opacity="0.18">
  <animate attributeName="r" values="145;185;145" dur="9s" repeatCount="indefinite"/>
  <animate attributeName="cx" values="130;160;130" dur="9s" repeatCount="indefinite"/>
</circle>
<circle cx="760" cy="110" r="190" fill="#BB9AF7" opacity="0.22">
  <animate attributeName="r" values="165;205;165" dur="8s" repeatCount="indefinite"/>
</circle>
<circle cx="450" cy="280" r="195" fill="#7DCFFF" opacity="0.10">
  <animate attributeName="r" values="170;210;170" dur="7s" repeatCount="indefinite"/>
</circle>

<!-- 顶部分隔极光条 -->
<rect x="0" y="0" width="900" height="6" fill="url(#gradBPP)"/>

<!-- 巨型渐变标题 Invinciblemighthub -->
<text x="50%" y="135" text-anchor="middle" font-family="Orbitron,Fira Code,Consolas,monospace" font-size="64" font-weight="800" fill="url(#gradBP)" filter="url(#glowBP)">
  Invinciblemighthub
</text>
<!-- 下划线 -->
<rect x="230" y="158" width="440" height="4" rx="2" fill="url(#gradBPP)" opacity="0.8"/>

<!-- 副标题 1 -->
<text x="50%" y="200" text-anchor="middle" font-family="Fira Code,Consolas,monospace" font-size="20" font-weight="600" fill="#7DCFFF">
  ✦ AI Market Demand Analysis Author ✦ Data Mining Explorer ✦
</text>

<!-- 副标题 2 -->
<text x="50%" y="230" text-anchor="middle" font-family="Fira Code,Consolas,monospace" font-size="17" fill="#A9B1D6">
  Selenium + NLP Pipeline Practioner  ·  Steam 1162260792  ·  Bili UID 3546385513187419
</text>

<!-- 底部 3 标签卡 -->
<g font-family="Fira Code,Consolas,monospace" font-size="14" font-weight="700" fill="#C0CAF5">
  <rect x="230" y="270" width="130" height="36" rx="18" fill="#7AA2F7" opacity="0.9"/>
  <text x="295" y="294" text-anchor="middle">☕ Coffee Powered</text>
  <rect x="385" y="270" width="130" height="36" rx="18" fill="#BB9AF7" opacity="0.9"/>
  <text x="450" y="294" text-anchor="middle">🧠 AI 80% Code</text>
  <rect x="540" y="270" width="130" height="36" rx="18" fill="#F7768E" opacity="0.9"/>
  <text x="605" y="294" text-anchor="middle">🎮 Pro Gamer</text>
</g>

<!-- 3 个脉冲光点 -->
<circle cx="80" cy="60" r="5" fill="#7DCFFF" opacity="0.9">
  <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
</circle>
<circle cx="820" cy="75" r="4" fill="#BB9AF7">
  <animate attributeName="opacity" values="1;0.15;1" dur="2.9s" repeatCount="indefinite"/>
</circle>
<circle cx="60" cy="290" r="3.5" fill="#9ECE6A">
  <animate attributeName="opacity" values="0.2;0.95;0.2" dur="1.9s" repeatCount="indefinite"/>
</circle>

<!-- 底部分隔条 -->
<rect x="0" y="334" width="900" height="6" fill="url(#gradBPP)"/>
</svg>